name: Github Actions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - uses: treeform/setup-nim-action@v6
      with:
        nim-version: '2.2.4'
    - run: nim check src/knobby.nim
    - run: nimble test -y

  gui:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: treeform/setup-nim-action@v6
      with:
        nim-version: '2.2.4'
    - uses: actions/checkout@v4
      with:
        repository: treeform/nimby
        ref: a800569be17821574dccb7a18a1fb99f65ff5309
        path: .ci-nimby
    - run: nim c --out:/tmp/nimby .ci-nimby/src/nimby.nim
    - run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libxtst6 xvfb dbus-x11 systemd openbox ffmpeg zenity
    - run: cd gui && /tmp/nimby create && cd app && /tmp/nimby sync nimby.lock
    - run: sh gui/app/tools/smoke.sh
    - run: nim r gui/app/tools/test_button_media.nim
    - run: sh gui/app/tools/editor_smoke.sh
